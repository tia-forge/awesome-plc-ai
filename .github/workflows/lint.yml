name: lint

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Quarterly-ish safety net: the first Monday of January, April, July and October.
    - cron: '0 6 * * 1'

jobs:
  awesome-lint:
    name: awesome-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint the list
        run: npx --yes awesome-lint

  links:
    name: link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every link in the list
        run: bash scripts/check-links.sh
